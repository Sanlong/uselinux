---
- name: 安装 RKE2 Server
  hosts: all
  vars:
    k8s_version: "1.35"
    rke2_version: "v{{ k8s_version }}.4+rke2r1"
    rke2_token: "123456"
    system_default_registry: "registry.cn-hangzhou.aliyuncs.com"
    rke2_server_lb: rke2.mslinfo.lan
    rke2_server_lb_ip: "10.0.30.116"
    rke2_server_url: "https://{{ rke2_server_lb }}:9345"

  tasks:
    - name: 检查系统是否已经安装此版本的 RKE2
      ansible.builtin.shell: |
        rke2 --version | head -1 | awk '{print $3}'
      register: rke2_installed_version
      changed_when: false

    - name: 检查系统是否已经安装此版本的 RKE2结果
      ansible.builtin.debug:
        msg: "检查系统是否已经安装此版本的 RKE2 结果：{{ rke2_installed_version.stdout }}"

    - name: 初始化 Debian 系系统 (Debian/Ubuntu)
      when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']
      block:

        - name: 安装依赖(Debian/Ubuntu)
          ansible.builtin.apt:
            name:
              - curl
              - gnupg
              - tar
              - chrony
            state: present
            update_cache: true
          become: true
        
        - name: 配置chrony服务器
          ansible.builtin.copy:
            dest: /etc/chrony/sources.d/cn-ntp.sources
            content: |
              server ntp.aliyun.com iburst
              server ntp.tencent.com iburst
          become: true

        - name: 重启chrony服务
          ansible.builtin.systemd:
            name: chronyd
            enabled: true
            state: restarted
            daemon_reload: true
          become: true

        - name: 修正时间同步
          ansible.builtin.command: chronyc makestep
          become: true

    - name: 部署 RKE2 Server
      block:
        - name: 创建 RKE2 配置目录
          ansible.builtin.file:
            path: /etc/rancher/rke2
            state: directory
          become: true

        - name: 写入 RKE2 Server 配置文件
          ansible.builtin.copy:
            dest: /etc/rancher/rke2/config.yaml
            content: |
              server: {{ rke2_server_url }}
              token: {{ rke2_token }}
              system-default-registry: {{ system_default_registry }}
              ingress-controller: traefik
              tls-san:
                - {{ rke2_server_lb }}
                - {{ rke2_server_lb_ip }}
          become: true
        - name: 使用国内镜像安装RKE2
          ansible.builtin.shell: |
            curl -sfL https://rancher-mirror.rancher.cn/rke2/install.sh | sh -
          environment:
            INSTALL_RKE2_MIRROR: cn
            INSTALL_RKE2_VERSION: "{{ rke2_version }}"
          become: true
        - name: 启用并启动 RKE2 Server 服务
          ansible.builtin.systemd:
            name: rke2-server
            enabled: true
            daemon_reload: true
          become: true

    - name: 安装kubectl（ubuntu）
      when: ansible_facts['distribution'] in ['Ubuntu', 'Debian']
      block:
        - name: 安装kubectl（ubuntu）
          community.general.snap:
            name: kubectl
            channel: "{{ k8s_version }}/stable"
            classic: true
          become: true
          changed_when: true
