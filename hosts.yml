---
# Ansible 主机清单文件（YAML 格式）
# 初学者指南：
# 1. 这是一个 YAML 格式的 Ansible 主机清单文件
# 2. 用于定义和组织 Ansible 管理的服务器
# 3. 缩进非常重要，必须使用空格（通常是 2 个或 4 个空格）

# 主机组定义
# 主组 'al' 包含多个子组
# children 表示该组包含子组

# 主组 'al' 及其子组
al:  # 主组名称
  children:  # 子组列表
    ceph:  # Ceph 存储集群节点组
    rke:  # RKE Kubernetes 集群节点组
    postgresql:  # PostgreSQL 数据库节点组
    mariadb:  # MariaDB 数据库节点组
    dns_server:  # DNS 服务器节点组
    other:  # 其他服务器节点组

# Ceph 存储集群节点
ceph:
  hosts:  # 该组下的具体主机
    ceph1:  # 主机名称
      ansible_host: 10.0.30.101  # 主机的实际 IP 地址
      ansible_user: root  # 连接该主机使用的用户名
    ceph2:
      ansible_host: 10.0.30.102
      ansible_user: root
    ceph3:
      ansible_host: 10.0.30.103
      ansible_user: root

# RKE Kubernetes 集群节点
rke:
  hosts:
    rk1:
      ansible_host: 10.0.30.111
      ansible_user: root
    rk2:
      ansible_host: 10.0.30.112
      ansible_user: root
    rk3:
      ansible_host: 10.0.30.113
      ansible_user: root

# PostgreSQL 数据库节点
postgresql:
  hosts:
    postgre:
      ansible_host: 10.0.30.54
      ansible_user: root

# MariaDB 数据库节点
mariadb:
  hosts:
    maria:
      ansible_host: 10.0.30.33
      ansible_user: root

# DNS 服务器节点
dns_server:
  hosts:
    dns:
      ansible_host: 10.0.30.53
      ansible_user: root

# 其他服务器节点
other:
  hosts:
    zabbix:  # Zabbix 监控服务器
      ansible_host: 10.0.30.70
      ansible_user: root
    grafana:  # Grafana 可视化服务器
      ansible_host: 10.0.30.30
      ansible_user: root
    loki:  # Loki 日志聚合服务器
      ansible_host: 10.0.30.31
      ansible_user: root
    rk9:  # 其他服务器
      ansible_host: 10.0.30.9
      ansible_user: root

# Uyuni 服务器节点（系统管理工具）
uyuni:
  hosts:
    opse6:
      ansible_host: 10.0.30.6
      ansible_user: root

# 数据库服务器节点
dbservers:
  hosts:
    db1:
      ansible_host: 192.168.1.20
      ansible_user: root

# 全局变量（适用于所有主机）
all:
  vars:  # 变量定义
    ansible_python_interpreter: /usr/bin/python3  # 指定 Python 解释器路径

# 使用指南：
# 1. 如何运行 Ansible 命令：
#    ansible -i hosts.yml all -m ping  # 测试所有主机连接
#    ansible-playbook -i hosts.yml playbook.yml  # 运行剧本
#
# 2. 如何针对特定组运行命令：
#    ansible -i hosts.yml ceph -m ping  # 只测试 ceph 组
#
# 3. 如何添加新主机：
#    - 在相应的组下添加新的主机条目
#    - 确保缩进正确
#
# 4. 如何添加新组：
#    - 在文件中添加新的组定义
#    - 如果是子组，需要在父组的 children 中添加
#
# 5. 如何添加主机变量：
#    - 在主机条目下添加新的键值对
#    - 例如：ansible_ssh_pass: your_password  # 不推荐，建议使用密钥认证
