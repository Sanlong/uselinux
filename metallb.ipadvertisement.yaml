# metallb-config.yaml
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: metallb-pool
  namespace: metallb
spec:
  addresses:
  - 10.0.30.114-10.0.30.115  # 可用 IP 范围
#  - 192.168.2.0/24               # 或 CIDR 格式
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-advert
  namespace: metallb
spec:
  ipAddressPools:
  - metallb-pool
