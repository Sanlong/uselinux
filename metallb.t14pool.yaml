# metallb-config.yaml
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: t14-pool
  namespace: metallb-system
spec:
  addresses:
  - 10.0.20.10-10.0.20.99  # 可用 IP 范围
#  - 192.168.2.0/24               # 或 CIDR 格式
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: t14-l2-adv
  namespace: metallb-system
spec:
  ipAddressPools:
  - t14-pool
